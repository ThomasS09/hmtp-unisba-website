name: HMTP UNISBA CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  PHP_VERSION: '8.3'

jobs:
  # Frontend Build & Test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Run typecheck
        run: npm run typecheck
      
      - name: Run lint
        run: npm run lint
      
      - name: Build
        run: npm run build

  # Backend Test
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, curl, openssl, fileinfo, pdo_sqlite, sqlite3
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare APP_KEY
        run: |
          cp .env.example .env
          php artisan key:generate

      # Test memakai sqlite :memory: (lihat phpunit.xml), jadi tidak butuh service MySQL
      - name: Run tests
        run: php artisan test

