copenapi: 3.0.3
info:
  title: HMTP UNISBA API
  description: API documentation for the HMTP UNISBA Website backend.
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
    description: Local Development Server
paths:
  /news:
    get:
      summary: Get paginated news list
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: A paginated list of news articles
  /aspirations:
    post:
      summary: Submit a new aspiration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                message:
                  type: string
      responses:
        '201':
          description: Aspiration submitted successfully
  /login:
    post:
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authentication successful, returns bearer token
